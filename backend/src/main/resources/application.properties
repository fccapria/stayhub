spring.application.name=backend
server.port=8080

# Database Configuration (MariaDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:stayhub}?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:stayhub_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:stayhub_password}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.docker.compose.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security - OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:9000}/realms/${KEYCLOAK_REALM:stayhub}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:9000}/realms/${KEYCLOAK_REALM:stayhub}/protocol/openid-connect/certs
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:9000}
keycloak.realm=${KEYCLOAK_REALM:stayhub}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# Enable H2 or other management features if necessary, or WireMock integration properties
# Let's add WireMock configuration property
wiremock.server.port=8089

# PayPal Configuration
paypal.client-id=${PAYPAL_CLIENT_ID:mock_client_id}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:mock_client_secret}
paypal.api-url=${PAYPAL_API_URL:https://api-m.sandbox.paypal.com}

# File Upload Configuration (Local Storage)
stayhub.upload.dir=${STAYHUB_UPLOAD_DIR:uploads/rooms}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Email Notification Configuration (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

stayhub.mail.enabled=${STAYHUB_MAIL_ENABLED:true}
stayhub.mail.from=${STAYHUB_MAIL_FROM:StayHub <support@stayhub.com>}