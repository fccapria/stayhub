spring.application.name=backend
server.port=8080

# Database Configuration (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/stayhub?createDatabaseIfNotExist=true
spring.datasource.username=stayhub_user
spring.datasource.password=stayhub_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.docker.compose.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security - OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/realms/stayhub
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/realms/stayhub/protocol/openid-connect/certs

# Enable H2 or other management features if necessary, or WireMock integration properties
# Let's add WireMock configuration property
wiremock.server.port=8089

# PayPal Configuration
paypal.client-id=${PAYPAL_CLIENT_ID:mock_client_id}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:mock_client_secret}
paypal.api-url=${PAYPAL_API_URL:https://api-m.sandbox.paypal.com}