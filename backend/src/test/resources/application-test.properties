spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable OIDC issuer validation checks for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost:9000/realms/stayhub
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://localhost:9000/realms/stayhub/protocol/openid-connect/certs

wiremock.server.port=8089
