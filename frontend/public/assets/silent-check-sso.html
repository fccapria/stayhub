<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Silent Check SSO</title>
</head>
<body>
<script>
    parent.postMessage(JSON.stringify({
        type: 'keycloak-silent-check-sso',
        status: 'OK',
        sessionState: new URLSearchParams(window.location.search).get('session_state'),
        error: new URLSearchParams(window.location.search).get('error')
    }), window.location.origin);
</script>
</body>
</html>
